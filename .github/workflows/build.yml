name: build

# Cross-build the RTL8672 kernel from the Lexra fork and prove no forbidden
# Lexra instruction (lwl/lwr/swl/swr) is in it. Uses build/build-all.sh.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    # NetBSD 11's in-tree binutils/gcc don't build with very new host GCC
    # (Ubuntu 24.04 ships GCC 14: "static_assert" errors in binutils). Pin to
    # 22.04 (GCC 11), which cross-builds the NetBSD-11 tools cleanly.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout (loader, docs, build script)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git ca-certificates

      - name: Resolve fork branch commit (for the tools cache key)
        id: fork
        run: echo "sha=$(git ls-remote https://github.com/Gyuri1999/src.git h108n-lexra | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache cross toolchain
        uses: actions/cache@v4
        with:
          path: nb/tools
          key: nbtools-${{ runner.os }}-${{ steps.fork.outputs.sha }}
          restore-keys: nbtools-${{ runner.os }}-

      - name: Reproducible build (tools + RTL8672 kernel + checks)
        env:
          BRANCH: h108n-lexra
          WORK: ${{ github.workspace }}/nb
        run: sh build/build-all.sh

      - name: Diagnose soft-float (libgcc) for forbidden Lexra instructions
        run: |
          set -eu
          objd=nb/tools/bin/mipseb--netbsd-objdump
          tab=$(printf '\t')
          found=0
          for lg in $(find nb -name 'libgcc*.a' 2>/dev/null); do
            n=$("$objd" -d "$lg" | grep -c -E "${tab}(lwl|lwr|swl|swr)${tab}" || true)
            echo "libgcc forbidden-insn count: $n   <- $lg"
            found=$((found + n))
          done
          echo "=== soft-float routines in libgcc (should be lwl/lwr/swl/swr free) ==="
          lg=$(find nb -name 'libgcc.a' | head -1)
          for sym in __divdf3 __floatsidf __muldf3 __fixdfsi __adddf3; do
            c=$("$objd" -d "$lg" 2>/dev/null \
                | awk -v s="<$sym>:" '$0 ~ s{p=1} p&&/^$/{p=0} p' \
                | grep -c -E "${tab}(lwl|lwr|swl|swr)${tab}" || true)
            echo "  $sym: $c forbidden"
          done
          echo "TOTAL forbidden instructions in libgcc: $found"
          echo "libgcc_forbidden=$found" >> "$GITHUB_OUTPUT" 2>/dev/null || true

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: netbsd-RTL8672
          path: nb/obj/sys/arch/evbmips/compile/RTL8672/netbsd
          if-no-files-found: error
